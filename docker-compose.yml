services:
  options-dashboard:
    build: .
    container_name: options-dashboard
    env_file:
      - .env
    command: python -m streamlit run dashboard.py --server.port 8502 --server.headless true --server.address 0.0.0.0 --server.enableCORS false --server.enableXsrfProtection false
    expose:
      - "8502"
    volumes:
      - ./outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8502')"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  options-worker:
    build: .
    container_name: options-worker
    env_file:
      - .env
    command: sh -lc "python market_monitor.py --loop --interval-seconds ${WORKER_INTERVAL_SECONDS:-300}"
    volumes:
      - ./outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "from pathlib import Path; import sys,time; path=Path('/app/outputs/monitor_status.csv'); sys.exit(0 if path.exists() and time.time()-path.stat().st_mtime < 1800 else 1)"
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s

  options-gateway:
    build: .
    container_name: options-gateway
    profiles:
      - secure
    env_file:
      - .env
    command: python -m uvicorn auth_gateway:app --host 0.0.0.0 --port 8080
    depends_on:
      options-dashboard:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/_health')"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
